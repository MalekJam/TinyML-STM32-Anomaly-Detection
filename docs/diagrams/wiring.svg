<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670">
 <style>
  text {font-family:Arial,Helvetica,sans-serif;fill:#203148} .heading{font-size:28px;font-weight:700}
  .sub{font-size:15px;fill:#557089}.box{stroke:#8aa5bf;stroke-width:2}.device{font-weight:bold;font-size:22px;fill:white}
  .pin{font-family:monospace;font-size:17px;fill:#fff}.note{font-size:15px;fill:#42536c}
  .wire{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.end{stroke:#fff;stroke-width:1}
 </style>
 <rect width="1120" height="670" rx="18" fill="#f8fbfd"/>
 <text x="50" y="54" class="heading">EdgeGuard AI · Blue Pill wiring</text>
 <text x="50" y="82" class="sub">ST-LINK V2 programs over SWD · FTDI is for PC telemetry · common ground · 3.3V logic</text>
 <!-- devices -->
 <rect x="421" y="115" width="306" height="440" rx="18" fill="#1763a1" class="box"/>
 <text x="574" y="155" class="device" text-anchor="middle">STM32F103C8T6</text>
 <text x="574" y="181" class="device" text-anchor="middle" style="font-size:17px">Blue Pill</text>
 <line x1="452" y1="195" x2="695" y2="195" stroke="#6ca6d0"/>
 <rect x="52" y="130" width="293" height="237" rx="15" fill="#157c83" class="box"/>
 <text x="198" y="170" class="device" text-anchor="middle">MPU6050 / GY-521</text>
 <rect x="789" y="135" width="279" height="245" rx="15" fill="#7554a4" class="box"/>
 <text x="929" y="173" class="device" text-anchor="middle">ST-LINK V2</text>
 <rect x="790" y="426" width="278" height="134" rx="15" fill="#ad6034" class="box"/>
 <text x="929" y="465" class="device" text-anchor="middle">USB-FTDI</text>
 <!-- pin text -->
 <text x="304" y="213" text-anchor="end" class="pin">VCC</text>
 <text x="304" y="249" text-anchor="end" class="pin">GND</text>
 <text x="304" y="285" text-anchor="end" class="pin">SCL</text>
 <text x="304" y="321" text-anchor="end" class="pin">SDA</text>
 <text x="304" y="352" text-anchor="end" class="pin" style="font-size:14px">AD0 → GND on sensor</text>
 <text x="445" y="213" class="pin">3V3</text>
 <text x="445" y="249" class="pin">GND</text>
 <text x="445" y="285" class="pin">PB6 / I²C SCL</text>
 <text x="445" y="321" class="pin">PB7 / I²C SDA</text>
 <text x="445" y="369" class="pin">PA13 / SWDIO</text>
 <text x="445" y="405" class="pin">PA14 / SWCLK</text>
 <text x="445" y="442" class="pin">PA9 / UART TX</text>
 <text x="445" y="478" class="pin">PA10 / UART RX</text>
 <text x="445" y="516" class="pin">GND</text>
 <text x="810" y="218" class="pin">SWDIO</text>
 <text x="810" y="258" class="pin">SWCLK</text>
 <text x="810" y="298" class="pin">GND</text>
 <text x="810" y="339" class="pin" style="font-size:13px">3V3/Vref: verify first</text>
 <text x="810" y="491" class="pin">RXD ← PA9</text>
 <text x="810" y="518" class="pin">TXD → PA10</text>
 <text x="810" y="545" class="pin" style="font-size:14px">GND (no FTDI VCC)</text>
 <!-- colored wires, behind labels but outside box areas -->
 <path d="M345 206 L421 206" class="wire" stroke="#e6a440"/>
 <path d="M345 242 L421 242" class="wire" stroke="#65758c"/>
 <path d="M345 278 L421 278" class="wire" stroke="#9e78d1"/>
 <path d="M345 314 L421 314" class="wire" stroke="#36bf94"/>
 <path d="M727 367 L760 367 L760 208 L789 208" class="wire" stroke="#36bf94"/>
 <path d="M727 403 L766 403 L766 248 L789 248" class="wire" stroke="#9e78d1"/>
 <path d="M727 515 L753 515 L753 289 L789 289" class="wire" stroke="#65758c"/>
 <path d="M727 435 L772 435 L772 483 L789 483" class="wire" stroke="#e6a440"/>
 <path d="M727 473 L742 473 L742 510 L789 510" class="wire" stroke="#36bf94"/>
 <path d="M727 520 L735 520 L735 537 L789 537" class="wire" stroke="#65758c"/>
 <!-- power note -->
 <rect x="56" y="415" width="286" height="141" rx="12" fill="#e3edf6" stroke="#bbcede"/>
 <text x="76" y="442" class="note" font-weight="bold">Power: Blue Pill micro-USB</text>
 <text x="76" y="470" class="note">• Sensor VCC from Blue Pill 3V3</text>
 <text x="76" y="495" class="note">• Share GND across all devices</text>
 <text x="76" y="520" class="note">• Do not join two power outputs</text>
 <text x="76" y="545" class="note">• FTDI TXD must be 3.3V logic</text>
 <rect x="53" y="593" width="1014" height="51" rx="11" fill="#fff4dc" stroke="#e6ca88"/>
 <text x="71" y="615" class="note" font-weight="bold">Before connecting ST-LINK Vref/3V3, inspect your specific dongle:</text>
 <text x="71" y="636" class="note">some clones supply 3.3V while others only sense target voltage. This diagram intentionally omits that connection.</text>
 </svg>
